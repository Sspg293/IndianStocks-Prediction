// ---------- Data sources ----------
const STOCK_API = "http://65.0.104.9";
const CHART_API = "https://query1.finance.yahoo.com/v8/finance/chart";

// Own serverless proxy, hosted on the same domain as this site (Vercel
// function at /api/proxy). Runs server-side, so there's no browser CORS
// restriction to route around, and nothing here is a third-party "proxy"
// domain a network filter would recognize and block.
async function fetchJsonViaProxies(targetUrl){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try{
    const res = await fetch(`/api/proxy?url=${encodeURIComponent(targetUrl)}`, { signal: controller.signal, cache: 'no-store' });
    clearTimeout(timeout);
    const text = await res.text();
    if(!res.ok) throw new Error(`proxy status ${res.status}: ${text.slice(0,150)}`);
    try{
      return JSON.parse(text);
    } catch(parseErr){
      throw new Error(`bad JSON from proxy: ${text.slice(0,150)}`);
    }
  } catch(e){
    clearTimeout(timeout);
    if(e.name === 'AbortError') throw new Error('proxy request timed out (10s)');
    throw e;
  }
}

function fmt(n){ if(n==null) return "—"; const r = Math.round(n*100)/100; return r.toLocaleString('en-IN',{maximumFractionDigits:2}); }
function fmtVol(v){ if(v==null) return "—"; if(v>=10000000) return (v/10000000).toFixed(2)+" Cr shares"; if(v>=100000) return (v/100000).toFixed(2)+" L shares"; return v.toLocaleString('en-IN')+" shares"; }

// ---------- Live API calls (all routed through the CORS proxy chain) ----------

// Primary source: the community stock API (65.0.104.9). It has no uptime
// guarantee — it's a single hobbyist-run server, not a company's
// infrastructure — so it going down entirely (not just a CORS issue) is a
// real, recurring failure mode, separate from the proxy layer above.
async function customStockDetail(symbol){
  const data = await fetchJsonViaProxies(`${STOCK_API}/stock?symbol=${symbol}`);
  if(data.status !== 'success' || !data.data) throw new Error(data.message || 'no data');
  const d = data.data;
  return {
    symbol, name: d.company_name, sector: d.sector, price: d.last_price, change: d.change, pct: d.percent_change,
    open: d.open, prevClose: d.previous_close, dayLow: d.day_low, dayHigh: d.day_high,
    yrLow: d.year_low, yrHigh: d.year_high, volume: d.volume, pe: d.pe_ratio, mcap: d.market_cap
  };
}

async function customStockList(symbols){
  const data = await fetchJsonViaProxies(`${STOCK_API}/stock/list?symbols=${symbols.join(',')}`);
  if(data.status !== 'success' || !data.stocks) throw new Error(data.message || 'no stocks');
  return data.stocks.map(s => ({
    symbol: s.symbol, name: s.company_name, price: s.last_price, change: s.change,
    pct: s.percent_change, sector: s.sector, volume: s.volume, pe: s.pe_ratio, mcap: s.market_cap
  }));
}

// Fallback source: Yahoo Finance's own chart "meta" data, which includes a
// current quote alongside the historical prices. Independent infrastructure
// from the custom API above — if 65.0.104.9 is down, this still works.
// Fewer fields (no P/E, no market cap) but covers the essentials.
async function yahooQuote(symbol){
  const yahooSymbol = symbol.includes('.') ? symbol : symbol + '.NS';
  const data = await fetchJsonViaProxies(`${CHART_API}/${yahooSymbol}?interval=1d&range=5d`);
  const result = data.chart && data.chart.result && data.chart.result[0];
  const meta = result && result.meta;
  if(!meta || meta.regularMarketPrice == null) throw new Error('no yahoo meta');
  const price = meta.regularMarketPrice;
  const prevClose = meta.previousClose ?? meta.chartPreviousClose;
  const change = prevClose != null ? price - prevClose : null;
  const pct = prevClose ? (change / prevClose) * 100 : null;
  return {
    symbol, name: meta.longName || meta.shortName || symbol, sector: null,
    price, change, pct,
    open: meta.regularMarketOpen ?? null, prevClose,
    dayLow: meta.regularMarketDayLow ?? null, dayHigh: meta.regularMarketDayHigh ?? null,
    yrLow: meta.fiftyTwoWeekLow ?? null, yrHigh: meta.fiftyTwoWeekHigh ?? null,
    volume: meta.regularMarketVolume ?? null, pe: null, mcap: null
  };
}

async function liveSearch(query){
  const data = await fetchJsonViaProxies(`${STOCK_API}/search?q=${encodeURIComponent(query)}`);
  if(data.status !== 'success' || !data.results) throw new Error(data.message || 'no results');
  return data.results.map(r => ({ symbol: r.symbol, name: r.company_name, cat: "Stocks" }));
}

async function liveStockList(symbols){
  try{
    return await customStockList(symbols);
  } catch(e){
    // Custom server down/unreachable — fall back to Yahoo per-symbol.
    let firstErr = null;
    const results = await Promise.all(symbols.map(s => yahooQuote(s).catch(err => { if(!firstErr) firstErr = err; return null; })));
    const ok = results.filter(Boolean);
    if(ok.length === 0) throw new Error('both sources failed. Custom API: ' + e.message + ' | Yahoo: ' + (firstErr ? firstErr.message : 'unknown'));
    return ok;
  }
}

async function liveStockDetail(symbol){

async function liveHistory(symbol){
  const yahooSymbol = symbol.includes('.') ? symbol : symbol + '.NS';
  const data = await fetchJsonViaProxies(`${CHART_API}/${yahooSymbol}?interval=1d&range=1mo`);
  const result = data.chart && data.chart.result && data.chart.result[0];
  if(!result) throw new Error('no chart result');
  const closes = result.indicators.quote[0].close.filter(c => c != null);
  if(closes.length < 2) throw new Error('not enough points');
  return closes;
}

async function liveIndex(yahooSymbol){
  const data = await fetchJsonViaProxies(`${CHART_API}/${yahooSymbol}?interval=1d&range=5d`);
  const result = data.chart && data.chart.result && data.chart.result[0];
  const meta = result && result.meta;
  if(!meta || meta.regularMarketPrice == null) throw new Error('no index meta');
  const price = meta.regularMarketPrice;
  const prevClose = meta.previousClose ?? meta.chartPreviousClose;
  const change = prevClose != null ? price - prevClose : null;
  const pct = prevClose ? (change / prevClose) * 100 : null;
  return { price, change, pct };
}

// ---------- Chart drawing ----------
function linearTrendProjection(points, days){
  const n = points.length;
  const xs = points.map((_, i) => i);
  const meanX = xs.reduce((a,b)=>a+b,0) / n;
  const meanY = points.reduce((a,b)=>a+b,0) / n;
  let num = 0, den = 0;
  for(let i=0;i<n;i++){ num += (xs[i]-meanX)*(points[i]-meanY); den += (xs[i]-meanX)**2; }
  const slope = den === 0 ? 0 : num/den;
  const intercept = meanY - slope*meanX;
  const projected = [];
  for(let i=0;i<days;i++){ projected.push(intercept + slope*(n + i)); }
  return projected;
}

function drawChart(canvas, points, color, projection){
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.clientWidth * 2;
  const h = canvas.height = canvas.clientHeight * 2;
  ctx.clearRect(0,0,w,h);

  const all = projection ? points.concat(projection) : points;
  const min = Math.min(...all), max = Math.max(...all);
  const pad = 10, range = (max - min) || 1;
  const totalLen = all.length;
  const xFor = i => pad + (i/(totalLen-1)) * (w - pad*2);
  const yFor = v => h - pad - ((v-min)/range) * (h - pad*2);

  ctx.beginPath();
  points.forEach((p,i) => { const x=xFor(i), y=yFor(p); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();

  const lastX = xFor(points.length-1), lastY = yFor(points[points.length-1]);
  ctx.beginPath(); ctx.arc(lastX,lastY,7,0,Math.PI*2); ctx.fillStyle = color; ctx.fill();

  if(projection && projection.length){
    ctx.beginPath();
    ctx.setLineDash([10, 8]);
    ctx.moveTo(lastX, lastY);
    projection.forEach((p,i) => { const x=xFor(points.length+i), y=yFor(p); ctx.lineTo(x,y); });
    ctx.strokeStyle = '#8B93A1';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function seededHistory(symbol, endPrice){
  let seed = 0; for(let i=0;i<symbol.length;i++) seed += symbol.charCodeAt(i);
  const rand = s => { const x = Math.sin(s)*10000; return x - Math.floor(x); };
  let p = endPrice * (0.88 + rand(seed)*0.06);
  const pts = [];
  for(let d=0; d<30; d++){ const r = rand(seed + d*7.3) - 0.5; p += p*r*0.018; pts.push(p); }
  pts[29] = endPrice;
  return pts;
}

// ---------- Home dashboard (indices, top movers, popular) ----------
async function renderIndices(){
  const el = document.getElementById('indices');
  const cards = await Promise.all(INDICES.map(async idx => {
    try{
      const d = await liveIndex(idx.yahoo);
      return { ...idx, ...d, live: true };
    } catch(e){
      return { ...idx, price: null, change: null, pct: null, live: false };
    }
  }));
  el.innerHTML = cards.map(c => {
    if(c.price == null) return `<div class="index-card"><div class="index-name">${c.label}</div><div style="color:var(--muted); font-size:13px; margin-top:4px;">Unavailable</div></div>`;
    const up = (c.change ?? 0) >= 0;
    const color = up ? 'var(--gain)' : 'var(--loss)';
    const sign = up ? '+' : '';
    return `<div class="index-card">
      <div class="index-name">${c.label}</div>
      <div class="index-value">${fmt(c.price)}</div>
      <div class="index-change" style="color:${color}">${sign}${fmt(c.change)} (${sign}${fmt(c.pct)}%)</div>
    </div>`;
  }).join('');
}

async function renderPopularAndMovers(){
  const popEl = document.getElementById('popular');
  const movEl = document.getElementById('movers');
  let items, fromSample = false, errMsg = '';
  try{
    items = await liveStockList(POPULAR_SYMBOLS);
    liveDataAvailable = true;
  } catch(e){
    fromSample = true;
    errMsg = e.message || String(e);
    items = SAMPLE.filter(s => POPULAR_SYMBOLS.includes(s.symbol));
  }

  if(fromSample){
    showBanner("Live data failed: " + errMsg);
  }

  const sorted = [...items].sort((a,b) => (b.pct ?? 0) - (a.pct ?? 0));
  movEl.innerHTML = sorted.slice(0,3).map(s => moverRow(s)).join('');
  popEl.innerHTML = items.map(s => moverRow(s)).join('');

  [movEl, popEl].forEach(el => {
    el.querySelectorAll('.movers-row').forEach(row => row.addEventListener('click', () => showDetail(row.dataset.symbol)));
  });
}

function moverRow(s){
  const up = (s.change ?? 0) >= 0;
  const color = up ? 'var(--gain)' : 'var(--loss)';
  const sign = up ? '+' : '';
  return `<div class="movers-row" data-symbol="${s.symbol}">
    <div><div class="rname">${s.name}</div><div class="rmeta">${s.symbol}</div></div>
    <div style="text-align:right;"><div class="rprice">₹${fmt(s.price)}</div><div class="rpct" style="color:${color}">${sign}${fmt(s.pct)}%</div></div>
  </div>`;
}

function loadHomeDashboard(){
  document.getElementById('home-dashboard').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('count').textContent = '';
  renderIndices();
  renderPopularAndMovers();
}

  const el = document.getElementById('results');
  document.getElementById('count').textContent = list.length + (list.length===1?' result':' results') + (fromSample ? ' (sample data)' : '');

  el.innerHTML = list.map(s => {
    const up = (s.change ?? 0) >= 0;

      : '';
    return `<div class="row" data-symbol="${s.symbol}">
      <div><div class="rname">${s.name}</div><div class="rmeta">${s.symbol} · ${s.cat}</div></div>
      ${priceHtml}
    </div>`;
  }).join('');
  el.querySelectorAll('.row').forEach(row => row.addEventListener('click', () => showDetail(row.dataset.symbol)));
}

async function loadCurrentView(){
  const q = document.getElementById('search').value.trim();
  const el = document.getElementById('results');

  if(activeCategory === "All" && q.length < 2){
    loadHomeDashboard();
    return;
  }

  document.getElementById('home-dashboard').style.display = 'none';
  el.style.display = 'block';

  if(activeCategory !== "All"){
    const symbols = activeCategory === "Gold ETF" ? GOLD_ETFS : SILVER_ETFS;
    el.innerHTML = '<div class="spinner"></div>';
    try{
      const items = await liveStockList(symbols);
      liveDataAvailable = true;
      renderResults(items.map(i => ({...i, cat: activeCategory})), false);
    } catch(e){
      liveDataAvailable = false;
      showBanner("Live data failed: " + (e.message || String(e)));
      renderResults(SAMPLE.filter(s => s.cat === activeCategory), true);
    }
    return;
  }

  el.innerHTML = '<div class="spinner"></div>';
  try{
    const results = await liveSearch(q);
    liveDataAvailable = true;
    renderResults(results, false);
  } catch(e){
    liveDataAvailable = false;
    showBanner("Live search failed: " + (e.message || String(e)));
    const ql = q.toLowerCase();
    renderResults(SAMPLE.filter(s => s.name.toLowerCase().includes(ql) || s.symbol.toLowerCase().includes(ql)), true);
  }
}

// ---------- Detail screen ----------
async function showDetail(symbol, isRefresh){
  currentDetailSymbol = symbol;
  document.getElementById('search-screen').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  if(!isRefresh) document.getElementById('detailContent').innerHTML = '<div class="spinner"></div>';

  let s, fromSample = false;
  try{
    if(liveDataAvailable === false) throw new Error('skip live');
    s = await liveStockDetail(symbol);
  } catch(e){
    fromSample = true;
    s = SAMPLE.find(x => x.symbol === symbol) || SAMPLE[0];
  }

  const up = (s.change ?? 0) >= 0;
  const color = up ? 'var(--gain)' : 'var(--loss)';
  const sign = up ? '+' : '';
  const mcap = fmtMcap(s.mcap);

  let history, chartNote;
  try{
    if(fromSample) throw new Error('use seeded');
    history = await liveHistory(symbol);
    chartNote = "Last 30 days — live from Yahoo Finance";
  } catch(e){
    history = seededHistory(symbol, s.price);
    chartNote = "Last 30 days (sample — live chart unavailable from this page)";
  }

  const projection = linearTrendProjection(history, 7);

  document.getElementById('detailContent').innerHTML = `
    <div class="dname">${s.name}</div>
    <div class="dsector">${s.sector || ''}${s.cat ? ' · '+s.cat : ''}</div>
    <div class="dprice">₹${fmt(s.price)}</div>
    <div class="dchange" style="color:${color}">${sign}${fmt(s.change)}  (${sign}${fmt(s.pct)}%)</div>
    <div class="chart-label">${chartNote} · <span style="color:var(--muted)">refreshes every 15s</span></div>
    <canvas id="chart"></canvas>
    <div style="display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--muted);">
      <span><span style="display:inline-block;width:14px;height:2px;background:${color};vertical-align:middle;margin-right:4px;"></span>Actual price</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--muted);vertical-align:middle;margin-right:4px; border-top:2px dashed var(--muted);"></span>7-day trend projection</span>
    </div>
    <div class="disclaimer" style="margin-top:8px;">The dashed line is a straight-line statistical extrapolation of the last 30 days — plain arithmetic, not a machine-learning prediction. It shows "if this exact trend continued," and real prices routinely deviate from it. It is not a forecast of what will actually happen.</div>
    <div style="border-top:1px solid var(--ink-soft); margin-top:14px;"></div>
    ${s.open != null ? statRow('Open', '₹'+fmt(s.open)) : ''}
    ${s.prevClose != null ? statRow('Previous close', '₹'+fmt(s.prevClose)) : ''}
    ${s.dayLow != null ? statRow('Day range', '₹'+fmt(s.dayLow)+' – ₹'+fmt(s.dayHigh)) : ''}
    ${s.yrLow != null ? statRow('52-week range', '₹'+fmt(s.yrLow)+' – ₹'+fmt(s.yrHigh)) : ''}
    ${statRow('Volume', fmtVol(s.volume))}
    ${s.pe ? statRow('P/E ratio', fmt(s.pe)) : ''}
    ${mcap ? statRow('Market cap', mcap) : ''}
    <div class="disclaimer">${fromSample ? 'Sample data shown — live data unavailable from this page. ' : ''}Prices for educational use only — not investment advice. Verify with an official source before trading.</div>
  `;
  drawChart(document.getElementById('chart'), history, color, projection);

  if(!isRefresh){
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => {
      if(currentDetailSymbol === symbol) showDetail(symbol, true);
    }, 15000);
  }
}

function statRow(label, value){
  return `<div class="stat-row"><span>${label}</span><span>${value}</span></div>`;
}

document.getElementById('backBtn').addEventListener('click', () => {
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
  currentDetailSymbol = null;
  document.getElementById('detail').style.display = 'none';
  document.getElementById('search-screen').style.display = 'block';
});

let debounce;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(loadCurrentView, 350);
});

renderChips();
loadHomeDashboard();

// Visible build marker — if this text ever doesn't match what you expect,
// your browser is showing a cached/old version, not the current code.
const marker = document.createElement('div');
marker.style.cssText = 'text-align:center; color:var(--muted); font-size:10px; margin-top:30px; opacity:0.6;';
marker.textContent = 'build: v6-error-detail';
document.querySelector('.wrap').appendChild(marker);
</script>
</body>
